name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# One run per branch or pull request. A newer push to a pull request cancels
# the run it supersedes; runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, house style and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # LayoutProps and PageProps are generated into .next/types, and
      # next-env.d.ts with them. Neither is committed, so tsc needs them first.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: House style (no dash-like characters)
        run: npm run dashes

      - name: Build the static export
        run: npm run build
